{% extends "base.html" %}
{% block title %}Вход · EduCam{% endblock %}
{% block content %}
<section class="panel auth-panel">
  <h1>Вход</h1>
  <form method="post" class="form">
    <label>Почта <input name="email" type="email" required></label>
    <label>Пароль <input name="password" type="password" required></label>
    <button type="submit">Войти</button>
  </form>
  <p><a href="{{ url_for('auth.register') }}">Создать аккаунт</a></p>
  <p><a href="{{ url_for('demo.home') }}">Открыть демо-тест учитель + ученик</a></p>
  <div class="login-hint">
    <strong>Ученик:</strong> student1@example.com / password
  </div>
</section>
{% endblock %}
